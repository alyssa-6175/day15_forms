<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="background-color: beige;">
    <h1>Alyssa's Truth and Lie Game</h1>
    <hr>
    <h2>Introductions</h2>
    <form action="" id="name-form">
        <label for="fname">First Name:</label><br>
        <input type="text" name="fname" id="fname"><br>

        <label for="lname">Last Name:</label><br>
        <input type="text" name="lname" id="lname"><br>

        <label for="age">Age:</label><br>
        <input type="text" name="age" id="age"><br>
    </form>
    <br>
    <input type="button" value="SUBMIT" onclick="greet();">
    <p id="greet" style="font-size: x-large;">Welcome!</p>


    <script src="js/truth.js"></script>


    <h2>Warm up trivia question</h2>
    <p>What is the only food that cannot go bad?</p>
    <p id="trivia1-answer"></p>
    <form action="">
        <input type="radio" name="trivia1" id="chocolate">
        <label for="chocolate">Dark Chocolate</label><br>

        <input type="radio" name="trivia1" id="tuna">
        <label for="tuna">Canned Tuna</label><br>

        <input type="radio" name="trivia1" id="honey">
        <label for="honey">Honey</label><br>
    </form>
    <input type="button" value="SUBMIT" onclick="trivia1();">


    <h2>Two truths and a lie!</h2>
    <p>What is the lie?</p>
    <p id="trivia2-answer"></p>
    <form action="">
        <input type="radio" name="trivia2" id="spider">
        <label for="spider">All spiders have 8 legs</label><br>

        <input type="radio" name="trivia2" id="octopus">
        <label for="octopus">Octopi have 3 hearts</label><br>

        <input type="radio" name="trivia2" id="flamingo">
        <label for="flamingo">Flamingo are born pink</label><br>
    </form>
    <input type="button" value="SUBMIT" onclick="trivia2();">

    <h2>What's the password?</h2>
    <p>Hint: Apples are...?</p>

    <p id="trivia3-answer"></p>
    <form action="">
        <input type="password" name="trivia3" id="password">
    </form>
    <input type="button" value="SUBMIT" onclick="trivia3()">
</body>

</html>
